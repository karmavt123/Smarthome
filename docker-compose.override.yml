# Docker TU DONG doc file nay chong len docker-compose.yml.
#   docker compose up                          -> dev  (base + file nay)
#   docker compose -f docker-compose.yml up    -> demo (chi base)
#
# `image:` rieng la BAT BUOC: dev build o stage `build` (node), demo build o
# stage nginx. Dung chung mot tag thi che do build sau se ghi de che do truoc,
# va lan chay sau se lay nham image -> "npm: not found".
#
# KHONG khai bao `ports` o day: Compose NOI THEM chu khong thay the, se thanh
# hai mapping cung mot cong host. Vite nghe cong 80 de dung lai mapping cua base.
services:
  frontend:
    image: smarthome-frontend-dev
    build:
      target: build
    command: npm run start -- --host 0.0.0.0 --port 80
    volumes:
      - ./apps/frontend:/app
      # Volume an danh: che node_modules cua host (binary sai nen tang).
      - /app/node_modules
