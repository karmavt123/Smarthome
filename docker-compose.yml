services:
  mysql:
    image: mysql:8.0
    container_name: smarthome-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build:
      context: ./apps/backend
    container_name: smarthome-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      SEED_ON_BOOT: ${SEED_ON_BOOT}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD}
      PAIRING_TOKEN_TTL_MINUTES: ${PAIRING_TOKEN_TTL_MINUTES}
      DEVICE_HEARTBEAT_SECONDS: ${DEVICE_HEARTBEAT_SECONDS}
      DEVICE_OFFLINE_AFTER_SECONDS: ${DEVICE_OFFLINE_AFTER_SECONDS}
      DEVICE_COMMAND_TTL_SECONDS: ${DEVICE_COMMAND_TTL_SECONDS}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED}
      SIMULATOR_READING_SECONDS: ${SIMULATOR_READING_SECONDS}
      SIMULATOR_COMMAND_DELAY_MS: ${SIMULATOR_COMMAND_DELAY_MS}
      SIMULATOR_COMMAND_FAILURE_RATE: ${SIMULATOR_COMMAND_FAILURE_RATE}
      MQTT_ENABLED: ${MQTT_ENABLED}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - backend-uploads:/app/uploads

  ai-service:
    build:
      context: ./apps/ai-service
    container_name: smarthome-ai-service
    restart: unless-stopped
    environment:
      PORT: 5000
      FLASK_DEBUG: "false"
      SECRET_KEY: ${AI_SECRET_KEY}
      MODEL_DIR: /app/models
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      LIVENESS_THRESHOLD: ${LIVENESS_THRESHOLD}
      VOICE_INTENT_THRESHOLD: ${VOICE_INTENT_THRESHOLD}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: smarthome-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8000}:80"

volumes:
  mysql-data:
  backend-uploads:
