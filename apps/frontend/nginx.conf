server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSE - PHAI dat TRUOC /api/ va PHAI tat buffering.
    # nginx mac dinh gom response vao buffer roi moi gui. Voi stream vo han
    # thi no gom mai mai -> frontend khong nhan duoc event nao, khong bao loi,
    # chi im lang. Debug cai nay mat ca buoi.
    location /api/events/ {
        proxy_pass http://backend:3000/api/events/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anh khuon mat do backend serve qua express.static
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
    }

    # SPA fallback - thieu dong nay thi F5 o /devices ra 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
